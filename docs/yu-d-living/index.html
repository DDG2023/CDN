<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10151e">
  <title>D 客厅 · 197° 丁向 · 3D</title>
  <script type="module" src="./model-viewer.min.js"></script>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;background:#10151e;color:#f5f5f5}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}
    main{height:100%;position:relative;background:#10151e}
    model-viewer{display:block;width:100%;height:100%;--poster-color:#10151e;background:#10151e;touch-action:pan-y}
    header{position:absolute;inset:max(18px,env(safe-area-inset-top)) 20px auto;display:flex;justify-content:space-between;align-items:center;pointer-events:none;gap:12px}
    h1{margin:0;font-size:14px;font-weight:500;letter-spacing:.08em;color:#e5e8ec;text-shadow:0 1px 4px #10151e}
    nav{display:flex;gap:8px;pointer-events:auto}
    button{width:44px;height:44px;border:1px solid #ffffff26;border-radius:12px;background:#151e2bd9;color:#edf1f7;font:24px/1 system-ui;cursor:pointer;backdrop-filter:blur(10px)}
    button:hover{background:#24354a}button:focus-visible{outline:2px solid #93c5fd;outline-offset:4px}
    .progress{position:absolute;bottom:0;left:0;height:3px;width:0;background:#e6c788;transition:width .2s,opacity .3s}
    html[data-state="ready"] .progress{opacity:0}
    noscript img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
    @media(max-width:600px){header{inset:max(12px,env(safe-area-inset-top)) 12px auto}h1{font-size:12px;letter-spacing:.03em}button{width:42px;height:42px}}
  </style>
</head>
<body>
<main id="stage">
  <model-viewer id="model" src="./yu_d_living.glb" poster="./preview.png"
    alt="D 客厅，197° 丁向，三维模型" camera-controls touch-action="pan-y"
    camera-orbit="-39.3deg 45deg auto" camera-target="auto auto auto"
    min-camera-orbit="auto 0deg auto" max-camera-orbit="auto 180deg auto"
    min-field-of-view="10deg" max-field-of-view="60deg" field-of-view="35deg"
    environment-image="neutral" exposure="1.15" shadow-intensity="0.15"
    loading="eager" reveal="auto" interaction-prompt="auto">
  </model-viewer>
  <header>
    <h1>D 客厅 · 197° 丁向 · 3D</h1>
    <nav>
      <button id="reset" type="button" aria-label="重置视角" title="重置视角">↺</button>
      <button id="fullscreen" type="button" aria-label="全屏" title="全屏">⛶</button>
    </nav>
  </header>
  <div id="progress" class="progress" role="progressbar" aria-label="3D" aria-valuemin="0" aria-valuemax="100"></div>
  <noscript><img src="./preview.png" alt="D 客厅"></noscript>
</main>
<script type="module">
  const viewer=document.querySelector('#model');
  const progress=document.querySelector('#progress');
  viewer.addEventListener('progress',event=>{
    const value=Math.round(event.detail.totalProgress*100);
    progress.style.width=value+'%';progress.setAttribute('aria-valuenow',String(value));
  });
  viewer.addEventListener('load',()=>{document.documentElement.dataset.state='ready';});
  viewer.addEventListener('error',()=>{document.documentElement.dataset.state='error';});
  document.querySelector('#reset').addEventListener('click',()=>{
    viewer.cameraOrbit='-39.3deg 45deg auto';viewer.cameraTarget='auto auto auto';
    viewer.fieldOfView='35deg';viewer.jumpCameraToGoal();
  });
  document.querySelector('#fullscreen').addEventListener('click',async()=>{
    if(document.fullscreenElement){await document.exitFullscreen();}
    else if(document.querySelector('#stage').requestFullscreen){await document.querySelector('#stage').requestFullscreen();}
  });
</script>
</body>
</html>
